<form
  class="mt-8"
  [formGroup]="filterForm()"
  aria-label="Receptkeresés és szűrés"
  (submit)="$event.preventDefault()"
>
  <div class="flex items-center justify-between gap-4 max-sm:flex-col max-sm:items-stretch">
    <label class="input input-bordered w-full max-w-[560px] bg-base-100 max-sm:max-w-none">
      <svg
        class="size-4 shrink-0 text-base-content/50"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-4-4" />
      </svg>
      <input
        class="min-w-0"
        aria-label="Receptek keresése"
        type="search"
        placeholder="Keress recept, hozzávaló vagy kategória szerint..."
        [formControl]="filterForm().controls.search"
      />
    </label>
    <button
      class="btn btn-primary gap-2 px-5 shadow-md max-sm:w-full"
      type="button"
      (click)="createRecipe.emit()"
    >
      <svg
        class="size-4"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
      Recept hozzáadása
    </button>
  </div>

  <section
    class="mt-7 mb-6 flex items-end justify-between gap-4 border-b border-line max-sm:gap-2"
    aria-label="Receptszűrők"
  >
    <div
      class="tabs tabs-border max-w-full overflow-x-auto whitespace-nowrap max-sm:flex-1"
      role="tablist"
      aria-label="Szűrés kategória szerint"
    >
      @for (recipeCategory of [null, ...recipeCategories]; track recipeCategory) {
        <button
          class="tab"
          [class.tab-active]="filterForm().controls.category.value === recipeCategory"
          [class.text-primary]="filterForm().controls.category.value === recipeCategory"
          [attr.aria-selected]="filterForm().controls.category.value === recipeCategory"
          role="tab"
          type="button"
          (click)="filterForm().controls.category.setValue(recipeCategory)"
        >
          {{ recipeCategory === null ? 'Mind' : categoryTranslationMap[recipeCategory] }}
        </button>
      }
    </div>
    <select
      class="select w-auto border-0 bg-base-200 text-xs text-base-content/70 shadow-none"
      aria-label="Szűrés nehézség szerint"
      [formControl]="filterForm().controls.difficulty"
    >
      <option [ngValue]="null">Minden nehézség</option>
      @for (recipeDifficulty of recipeDifficulties; track recipeDifficulty) {
        <option [ngValue]="recipeDifficulty">
          {{ difficultyTranslationMap[recipeDifficulty] }}
        </option>
      }
    </select>
  </section>
</form>
