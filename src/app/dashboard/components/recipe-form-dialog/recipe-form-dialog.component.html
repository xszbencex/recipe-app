<dialog class="modal modal-open" open aria-labelledby="create-title" aria-modal="true">
  <div
    class="modal-box max-w-2xl bg-base-100 max-sm:max-h-screen"
  >
    <div class="mb-5 flex items-start justify-between border-b border-base-300 pb-4">
      <div>
        <p class="mb-2 text-xs font-bold tracking-widest text-earth">
          A GYŰJTEMÉNYEDHEZ
        </p>
        <h2 id="create-title" class="m-0 font-serif text-3xl font-normal text-ink">Új recept</h2>
      </div>
      <button
        class="btn btn-ghost btn-square"
        type="button"
        aria-label="Bezárás"
        (click)="dismiss.emit()"
      >
        ×
      </button>
    </div>
    <form class="grid gap-4" [formGroup]="recipeForm" (ngSubmit)="submit()">
      <label class="form-control grid gap-1.5">
        <span class="text-sm font-bold text-base-content">Recept neve</span>
        <input class="input input-bordered w-full bg-white" formControlName="title" required />
      </label>
      <label class="form-control grid gap-1.5">
        <span class="text-sm font-bold text-base-content">Rövid leírás</span>
        <textarea
          class="textarea textarea-bordered w-full bg-white"
          formControlName="description"
          rows="2"
          required
        ></textarea>
      </label>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="form-control grid gap-1.5">
          <span class="text-sm font-bold text-base-content">Kategória</span>
          <select class="select select-bordered w-full bg-white" formControlName="category">
            <option>Reggeli</option>
            <option>Ebéd</option>
            <option>Vacsora</option>
            <option>Desszert</option>
            <option>Snack</option>
          </select>
        </label>
        <label class="form-control grid gap-1.5">
          <span class="text-sm font-bold text-base-content">Nehézség</span>
          <select class="select select-bordered w-full bg-white" formControlName="difficulty">
            <option value="easy">Könnyű</option>
            <option value="medium">Közepes</option>
            <option value="hard">Haladó</option>
          </select>
        </label>
      </div>
      <label class="form-control grid gap-1">
        <span class="text-sm font-bold text-base-content"
          >Kép URL <span class="font-normal text-base-content/60">nem kötelező</span></span
        >
        <input class="input input-bordered w-full bg-white" type="url" formControlName="imageUrl" />
      </label>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="form-control grid gap-1.5">
          <span class="text-sm font-bold text-base-content"
            >Hozzávalók <span class="font-normal text-base-content/60">soronként egy</span></span
          >
          <textarea
            class="textarea textarea-bordered w-full bg-white"
            formControlName="ingredients"
            rows="4"
            required
          ></textarea>
        </label>
        <label class="form-control grid gap-1">
          <span class="text-sm font-bold text-base-content"
            >Elkészítés <span class="font-normal text-base-content/60">soronként egy lépés</span></span
          >
          <textarea
            class="textarea textarea-bordered w-full bg-white"
            formControlName="steps"
            rows="4"
            required
          ></textarea>
        </label>
      </div>
      @if (errorMessage()) {
        <p class="m-0 text-xs text-error" role="alert">{{ errorMessage() }}</p>
      }
      <div class="modal-action">
        <button class="btn btn-ghost" type="button" (click)="dismiss.emit()">Mégse</button>
        <button class="btn btn-primary" type="submit" [disabled]="isSaving()">
          @if (isSaving()) {
            <span class="loading loading-spinner loading-xs" aria-hidden="true"></span>
          }
          Recept mentése
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="button" aria-label="Bezárás" (click)="dismiss.emit()">Bezárás</button>
  </form>
</dialog>
