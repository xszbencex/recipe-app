<header class="sticky top-0 z-20 border-b border-base-300/80 bg-base-200/90 backdrop-blur-lg">
  <nav
    class="flex items-center justify-between min-h-18 mx-auto max-w-7xl px-4 sm:px-6 lg:px-8"
    aria-label="Fő navigáció"
  >
    <a
      class="inline-flex items-center gap-2.5 font-serif text-2xl tracking-tight text-ink no-underline"
      routerLink="/"
    >
      <span
        class="grid size-9 place-items-center rounded-full bg-primary text-primary-content"
        aria-hidden="true"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <g transform="translate(2.22, 0) scale(0.07475) translate(-125.184, -102.754)">
            <path
              style="fill: #f5f3ed"
              d="M254.758,334.635c-31.555,0-60.685-6.391-84.23-17.179v88.287c0,0.995,0.424,1.943,1.165,2.607 c0.646,0.577,1.478,0.893,2.335,0.893c0.128,0,0.257-0.007,0.386-0.021c0.011-0.001,162.879-0.035,163.141-0.004 c0.994,0.123,1.992-0.192,2.74-0.856c0.749-0.664,1.179-1.617,1.179-2.618v-88.553c-0.91,0.146-1.821,0.285-2.742,0.396 C315.23,328.3,286.191,334.635,254.758,334.635z"
            />
            <path
              style="fill: #ffffff"
              d="M341.044,169.298c-9.429-38.209-43.919-66.548-85.044-66.548 c-41.339,0-75.97,28.638-85.184,67.154c-0.4,1.673-0.744,5.079-5.37,5.948c-31.835,7.486-55.542,36.053-55.542,70.173 c0,34.871,24.759,63.94,57.652,70.637c0.684,0.139,2.671,0.657,2.971,0.794c23.546,10.788,52.676,17.179,84.23,17.179 c30.409,0,58.577-5.929,81.657-16.014c0.778-0.34,4.148-1.285,5.058-1.43c34.36-5.504,60.623-35.253,60.623-71.166 c0-34.003-23.544-62.492-55.217-70.097C344.213,175.035,342.551,174.982,341.044,169.298z"
            />
          </g>
        </svg>
      </span>
      Receptfüzet
    </a>
    <div class="flex flex-row items-center gap-4 max-sm:gap-2">
      @if (email() || displayName()) {
        <div class="flex items-center gap-2.5">
          <span
            class="grid size-9 shrink-0 place-items-center rounded-full bg-accent text-xs font-bold text-accent-content"
            aria-hidden="true"
          >
            {{ profileInitials() }}
          </span>
          <span class="hidden min-w-0 sm:block">
            <span class="block truncate text-xs font-bold text-base-content/90">
              {{ displayName() || email() }}
            </span>
            @if (displayName() && email()) {
              <span class="mt-0.5 block truncate text-[10px] text-base-content/60">
                {{ email() }}
              </span>
            }
          </span>
        </div>
        <span class="h-7 w-px bg-base-300 max-sm:hidden" aria-hidden="true"></span>
      }
      <button
        class="btn btn-ghost btn-sm gap-2 px-2 text-base-content/70 hover:text-error"
        type="button"
        (click)="logout.emit()"
      >
        <svg
          class="size-4"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
        </svg>
        <span class="max-sm:hidden">Kijelentkezés</span>
        <span class="sr-only sm:hidden">Kijelentkezés</span>
      </button>
    </div>
  </nav>
</header>
