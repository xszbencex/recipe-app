<header class="sticky top-0 z-5 border-b border-base-300 bg-base-200/95 backdrop-blur">
  <div
    class="navbar mx-auto min-h-20 w-full max-w-7xl gap-6 px-4 sm:px-6 lg:px-8 max-md:flex-wrap max-md:gap-3 max-md:py-3"
  >
    <div class="navbar-start max-md:flex-1"></div>
    <div class="navbar-center flex-1 max-md:order-3 max-md:w-full">
      <label class="input input-bordered mx-auto w-full max-w-sm bg-base-100">
        <svg
          class="size-4 shrink-0 text-base-content/60"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16"
          fill="none"
          aria-hidden="true"
        >
          <circle cx="6.5" cy="6.5" r="5.25" stroke="currentColor" stroke-width="1.5" />
          <path d="m10.5 10.5 4 4" stroke="currentColor" stroke-width="1.5" />
        </svg>
        <input
          class="w-full min-w-0"
          aria-label="Receptek keresése"
          type="search"
          placeholder="Keress a receptjeid között..."
          (input)="onSearchInput($event)"
        />
        <kbd class="kbd kbd-sm text-base-content/60 max-md:hidden">/</kbd>
      </label>
    </div>
    <div class="navbar-end gap-4 max-md:flex-1 max-md:justify-end">
      <button class="btn btn-primary" type="button" (click)="createRecipe.emit()">
        <span aria-hidden="true">+</span>
        Új recept
      </button>
      @if (email() || displayName()) {
        <span
          class="inline-flex items-center gap-2 border-0 bg-transparent text-xs font-semibold text-base-content/80"
          type="button"
        >
          <span
            class="grid size-9 shrink-0 place-items-center rounded-full bg-accent text-accent-content"
          >
            {{ (displayName() || email() || 'S').slice(0, 1).toUpperCase() }}
          </span>
          <span class="max-md:hidden">{{ displayName() || email() }}</span>
        </span>
      }
      <button
        class="btn btn-ghost btn-square"
        type="button"
        aria-label="Kijelentkezés"
        (click)="logout.emit()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-log-out preview-icon"
        >
          <path d="m16 17 5-5-5-5" />
          <path d="M21 12H9" />
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        </svg>
      </button>
    </div>
  </div>
</header>
