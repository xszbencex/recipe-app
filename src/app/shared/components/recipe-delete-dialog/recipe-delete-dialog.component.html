<dialog
  class="modal"
  [class.modal-open]="isOpen()"
  [open]="isOpen()"
  aria-labelledby="delete-title"
  aria-describedby="delete-description"
  (cancel)="onDialogCancel($event)"
  (close)="onDialogClose()"
>
  <section class="modal-box max-w-md border border-error/30 bg-base-100">
    <div class="mb-4 flex items-start gap-4">
      <span
        class="grid size-11 shrink-0 place-items-center rounded-full bg-error/10 text-error"
        aria-hidden="true"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 11v6" />
          <path d="M14 11v6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          <path d="M3 6h18" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
      </span>
      <div>
        <h2 id="delete-title" class="m-0 font-serif text-2xl font-normal text-error">
          Recept törlése
        </h2>
        <p id="delete-description" class="mt-2 mb-0 text-sm leading-relaxed text-base-content/75">
          Biztosan törlöd a(z) <strong>{{ recipeTitle() }}</strong> receptet? Ez a művelet nem
          vonható vissza.
        </p>
      </div>
    </div>
    @if (deleteError()) {
      <p class="m-0 text-sm text-error" role="alert">{{ deleteError() }}</p>
    }
    <form method="dialog" class="modal-action flex-col-reverse sm:flex-row">
      <button
        class="btn w-full sm:w-auto"
        type="button"
        [disabled]="isDeleting()"
        (click)="close()"
      >
        Mégse
      </button>
      <button
        class="btn btn-error w-full sm:w-auto"
        type="button"
        [disabled]="isDeleting()"
        (click)="confirm.emit()"
      >
        @if (isDeleting()) {
          <span class="loading loading-spinner loading-xs" aria-hidden="true"></span>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        }
        Törlés véglegesen
      </button>
    </form>
  </section>
</dialog>
